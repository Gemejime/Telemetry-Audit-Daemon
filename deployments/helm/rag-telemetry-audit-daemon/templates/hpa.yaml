{{- if .Values.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rag-telemetry-audit-daemon.fullname" . }}
  labels:
    {{- include "rag-telemetry-audit-daemon.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rag-telemetry-audit-daemon.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- if .Values.autoscaling.kafkaLagMetric.enabled }}
    - type: External
      external:
        metric:
          name: audit_consumer_lag_records
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.kafkaLagMetric.targetAverageValue | quote }}
    {{- end }}
{{- end }}
