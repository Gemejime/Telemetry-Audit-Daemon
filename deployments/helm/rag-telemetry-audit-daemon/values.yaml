replicaCount: 3

image:
  repository: ghcr.io/rag-platform/rag-telemetry-audit-daemon
  tag: "1.0.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 1000m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

env:
  GOMEMLIMIT: "1800MiB"
  GOGC: "80"
  HTTP_ADDR: ":8080"
  METRICS_ADDR: ":9090"
  METRICS_TENANT_ALLOWLIST: ""
  AUTH_JWT_AUDIENCE: "rag-telemetry-audit-daemon"
  RECONCILE_RATE_LIMIT_PER_MIN: "30"
  WAL_DIR: "/var/lib/audit-daemon/wal"
  WAL_MAX_BYTES: "5368709120"
  KAFKA_BROKERS: "<cluster-id>.<region>.aws.confluent.cloud:9092"
  KAFKA_TOPIC: "audit-compliance-records"
  KAFKA_GROUP_ID: "rag-telemetry-audit-daemon"
  KAFKA_TLS: "true"
  KAFKA_SASL_MECHANISM: "PLAIN"
  KAFKA_SASL_USERNAME: ""
  CLICKHOUSE_ADDR: "<service-id>.<region>.aws.clickhouse.cloud:9440"
  CLICKHOUSE_DATABASE: "default"
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_TLS: "true"
  CLICKHOUSE_TLS_INSECURE_SKIP_VERIFY: "false"
  S3_BUCKET: "rag-audit-worm-vault"
  S3_REGION: "us-east-1"
  S3_ENDPOINT: ""
  S3_USE_PATH_STYLE: "false"
  S3_RETENTION_YEARS: "7"
existingSecret: "rag-telemetry-audit-daemon-secrets"

walVolume:
  sizeLimit: 10Gi
  storageClassName: ""

service:
  type: ClusterIP
  httpPort: 8080
  metricsPort: 9090

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  kafkaLagMetric:
    enabled: false
    targetAverageValue: "5000"

networkPolicy:
  enabled: true
  prometheusNamespaceSelector:
    kubernetes.io/metadata.name: monitoring
  adminNamespaceSelector:
    kubernetes.io/metadata.name: ops-admin
  kafkaNamespaceSelector:
    kubernetes.io/metadata.name: kafka
  kafkaPort: 9092
  kafkaEgressCIDRs:
    - 0.0.0.0/0
  clickhouseNamespaceSelector:
    kubernetes.io/metadata.name: clickhouse
  clickhousePort: 9440
  clickhouseEgressCIDRs:
    - 0.0.0.0/0
  # s3EgressCIDRs controls TCP 443 egress for S3 (and AWS STS when using IRSA).
  # 0.0.0.0/0 explicitly allows unrestricted TCP 443 egress; [] omits the rule.
  # When narrowing s3EgressCIDRs to S3 VPC endpoint/prefix CIDRs, also include AWS STS CIDRs on TCP 443 for IRSA.
  s3EgressCIDRs:
    - 0.0.0.0/0
  # Optional TCP 80 CIDRs for AWS EC2 IMDS (169.254.169.254/32) and EKS Pod Identity agent (169.254.170.23/32).
  awsCredentialEgressCIDRs: []

prometheusRule:
  enabled: true
  labels: {}

canary:
  enabled: false
