replicaCount: 3

image:
  repository: ghcr.io/rag-platform/rag-telemetry-audit-daemon
  tag: "1.0.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 1000m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

env:
  GOMEMLIMIT: "1800MiB"
  GOGC: "80"
  HTTP_ADDR: ":8080"
  METRICS_ADDR: ":9090"
  METRICS_TENANT_ALLOWLIST: ""
  AUTH_JWT_AUDIENCE: "rag-telemetry-audit-daemon"
  RECONCILE_RATE_LIMIT_PER_MIN: "30"
  WAL_DIR: "./tmp/wal"
  WAL_MAX_BYTES: "5368709120"
  KAFKA_BROKERS: "localhost:9092"
  KAFKA_TOPIC: "audit-compliance-records"
  KAFKA_GROUP_ID: "rag-telemetry-audit-daemon"
  CLICKHOUSE_ADDR: "localhost:9000"
  CLICKHOUSE_DATABASE: "default"
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_TLS: "false"
  CLICKHOUSE_TLS_INSECURE_SKIP_VERIFY: "false"
  S3_BUCKET: "rag-audit-worm-vault"
  S3_REGION: "us-east-1"
  S3_ENDPOINT: ""
  S3_USE_PATH_STYLE: "false"
  S3_RETENTION_YEARS: "7"
existingSecret: "rag-telemetry-audit-daemon-secrets"

walVolume:
  sizeLimit: 10Gi

service:
  type: ClusterIP
  httpPort: 8080
  metricsPort: 9090

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  kafkaLagMetric:
    enabled: false
    targetAverageValue: "5000"

networkPolicy:
  enabled: true
  prometheusNamespaceSelector:
    kubernetes.io/metadata.name: monitoring
  adminNamespaceSelector:
    kubernetes.io/metadata.name: ops-admin
  kafkaNamespaceSelector:
    kubernetes.io/metadata.name: kafka
  kafkaPort: 9092
  clickhouseNamespaceSelector:
    kubernetes.io/metadata.name: clickhouse
  clickhousePort: 9000
  s3EgressCIDRs:
    - 0.0.0.0/0

prometheusRule:
  enabled: true
  labels: {}

canary:
  enabled: false
